name: Dependency Service CI

on:
  push:
    branches: [develop, main]
    paths:
      - "Final-Capstone/services/dependency-service/**"
  pull_request:
    branches: [develop, main]
    paths:
      - "Final-Capstone/services/dependency-service/**"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  ci:
    uses: Suwetha07/incident-Tracker/.github/workflows/ci.yaml@main
    with:
      image_name: "dependency-service"
      docker_context: "Final-Capstone/services/dependency-service"
    secrets: inherit
