name: Build Dependency Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'Final-Capstone/services/dependency-service/**'
      - '.github/workflows/ci-dependency-service.yml'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Final-Capstone/services/dependency-service/**'
      - '.github/workflows/ci-dependency-service.yml'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "dependency-service"
      docker_context: "Final-Capstone/services/dependency-service"
    secrets: inherit
