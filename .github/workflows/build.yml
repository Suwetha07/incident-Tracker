name: Build Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'terraform/**'
      - 'kubernetes/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'terraform/**'
      - 'kubernetes/**'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-web-app:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "web-app"
      docker_context: "Final-Capstone/frontend/web-app"
    secrets: inherit

  build-api-gateway:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "api-gateway"
      docker_context: "Final-Capstone/services/api-gateway"
    secrets: inherit

  build-analysis-service:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "analysis-service"
      docker_context: "Final-Capstone/services/analysis-service"
    secrets: inherit

  build-dependency-service:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "dependency-service"
      docker_context: "Final-Capstone/services/dependency-service"
    secrets: inherit

  build-incidents-service:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "incidents-service"
      docker_context: "Final-Capstone/services/incidents-service"
    secrets: inherit

  build-ingest-service:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "ingest-service"
      docker_context: "Final-Capstone/services/ingest-service"
    secrets: inherit

  build-telemetry-store:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "telemetry-store"
      docker_context: "Final-Capstone/services/telemetry-store"
    secrets: inherit

  build-worker-service:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "worker-service"
      docker_context: "Final-Capstone/services/worker-service"
    secrets: inherit
