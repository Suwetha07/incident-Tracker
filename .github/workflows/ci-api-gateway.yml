name: Build Api Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'Final-Capstone/services/api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Final-Capstone/services/api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_name: "api-gateway"
      docker_context: "Final-Capstone/services/api-gateway"
    secrets: inherit
