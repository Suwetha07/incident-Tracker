apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: incident-tracker-gateway
  namespace: dev
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: tracker.suwethaskill.shop
      tls:
        mode: Terminate
        certificateRefs:
          - name: suwethaskill-tls
      allowedRoutes:
        namespaces:
          from: Same
