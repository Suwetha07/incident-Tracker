apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID" # Client ID of the Workload Identity
    keyvaultName: "REPLACE_WITH_YOUR_KEYVAULT_NAME"
    objects:  |
      array:
        - |
          objectName: POSTGRES-USER
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: AZURE-TENANT-ID
          objectType: secret
    tenantId: "REPLACE_WITH_TENANT_ID"
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: POSTGRES-USER
          key: POSTGRES_USER
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: AZURE-TENANT-ID
          key: AZURE_TENANT_ID
