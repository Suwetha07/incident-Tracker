apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidenttracker-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Suwetha07/incident-Tracker.git
    targetRevision: main
    path: Final-Capstone/kubernetes/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
